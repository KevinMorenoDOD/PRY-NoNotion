services:
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nonotion
      POSTGRES_PASSWORD: nonotion
      POSTGRES_DB: nonotion
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Aplica migraciones (V01-V03) y seeds (V05) en orden al primer arranque.
      - ./migrations/V01_create_enums.sql:/docker-entrypoint-initdb.d/01_create_enums.sql:ro
      - ./migrations/V02_create_schema.sql:/docker-entrypoint-initdb.d/02_create_schema.sql:ro
      - ./migrations/V03_add_indexes.sql:/docker-entrypoint-initdb.d/03_add_indexes.sql:ro
      - ./migrations/V04_add_capacity_trigger.sql:/docker-entrypoint-initdb.d/04_add_capacity_trigger.sql:ro
      - ./seeds/V05_seed_data.sql:/docker-entrypoint-initdb.d/05_seed_data.sql:ro
volumes:
  pgdata: